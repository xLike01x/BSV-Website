# Lokale Entwicklungs-Datenbank für die BSV-Website.
# Start:   docker compose up -d
# Stopp:   docker compose down          (Daten bleiben erhalten)
# Reset:   docker compose down -v       (löscht die lokale Datenbank!)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsv
      POSTGRES_PASSWORD: bsv
      POSTGRES_DB: bsv
    ports:
      - '127.0.0.1:5432:5432'   # nur vom eigenen Rechner erreichbar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bsv']
      interval: 5s
      retries: 10

volumes:
  pgdata:
