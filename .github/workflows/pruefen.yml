# Automatische Prüfung bei jedem Push: Typen, Code-Regeln, bekannte Sicherheitslücken in Live-Paketen (Ausnahmen: package.json → pnpm.auditConfig)
name: Prüfen
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p .
      - run: npx eslint src --quiet
      - name: Sicherheitsmeldungen (nur Pakete, die live laufen; hohe und kritische)
        run: pnpm audit --prod --audit-level high
