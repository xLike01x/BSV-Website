# Alternative zu Caddy: nginx (Zertifikat mit certbot: sudo certbot --nginx -d www.buedericher-spielverein.de -d buedericher-spielverein.de)
# Einrichten:  sudo cp /srv/bsv/deploy/nginx.conf /etc/nginx/sites-available/bsv && sudo ln -s ../sites-available/bsv /etc/nginx/sites-enabled/
#              Domain anpassen, dann: sudo nginx -t && sudo systemctl reload nginx

# Bremse für Anmeldung und Formulare (zusätzlich zur Begrenzung in der Website)
limit_req_zone $binary_remote_addr zone=bsv_post:10m rate=30r/m;

server {
    listen 80;
    server_name www.buedericher-spielverein.de buedericher-spielverein.de;
    return 301 https://www.buedericher-spielverein.de$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.buedericher-spielverein.de;
    # Zeilen ssl_certificate … trägt certbot selbst ein

    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # WICHTIG: echte Besucher-Adresse setzen und mitgeschickte Werte überschreiben
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/(users/login|users/forgot-password|users/registrieren|kontaktanfragen|probetraining|mitgliedsantraege) {
        limit_req zone=bsv_post burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
