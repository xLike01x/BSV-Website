# Tägliche Sicherheitsprüfung der Pakete – läuft auch, wenn monatelang niemand etwas ändert.
# (Dateiname bleibt „wöchentlich“, damit Verlauf und Benachrichtigungen erhalten bleiben.)
# Schlägt fehl, sobald ein Paket, das live läuft, eine bekannte hohe oder kritische Lücke hat.
# GitHub schickt dann eine E-Mail (Einstellungen → Notifications → Actions: „Only notify for failed workflows“).
# Bewusst geprüfte Ausnahmen stehen in package.json unter pnpm.auditConfig.ignoreGhsas (Begründung: deploy/README.md).
name: Sicherheitsprüfung (täglich)
on:
  schedule:
    - cron: '17 5 * * *' # täglich ca. 7:17 Uhr deutscher Zeit (Sommerzeit; im Winter 6:17)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bekannte Sicherheitslücken in Live-Paketen (hoch und kritisch)
        run: pnpm audit --prod --audit-level high
